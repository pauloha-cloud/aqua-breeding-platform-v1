name: Deploy Stemma Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest black bandit
          if [ -f worker/requirements.txt ]; then pip install -r worker/requirements.txt; fi

      - name: Lint with flake8
        run: flake8 worker/app

      - name: Check formatting with black
        run: black --check worker/app

      - name: Security scan with bandit
        run: bandit -r worker/app

      - name: Run unit tests
        run: pytest worker/tests

